# Dokumenttitler
titles:
  main: "ANSKAFFELSESNOTAT"
  sections:
    metadata: "1. Oppsummering av Anskaffelsen"
    supplier: "2. Vurdering av Foreslått Leverandør"
    requirements: "3. Vurdering og Anvendelige Krav"
    specialists: "4. Spesialistvurderinger"
