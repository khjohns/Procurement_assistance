# NY SEKSJON: Tekster for risikovurderings-delen
risk_assessment_texts:
  title: "Risiko- og aktsomhetsvurderinger"
  
  intro_p1: "I henhold til Instruks for Oslo kommunes anskaffelser pkt. 7.1 skal det foretas en risikovurdering for brudd på menneskerettigheter, arbeidstakerrettigheter, internasjonal humanitærrett, miljøødeleggelse eller korrupsjon."
  intro_p2: "Denne anskaffelsen er vurdert å ha {risk_details}. Se vedlegg x «Aktsomhetsvurdering» for ytterligere detaljer."

  non_goods_intro: "Enkelte krav etter Oslomodellen utløses hvis det foreligger *risiko* eller *høy risiko* for arbeidslivskriminalitet eller sosial dumping."
  non_goods_details: "Anskaffelsen gjelder **{procurement_category}**. Kategorien er vurdert å samlet sett ha **{category_risk_level}** risiko."

standard_texts:
  no_requirements_under_100k: "Ingen krav er automatisk identifisert. Særskilte krav i henhold til anskaffelsesregelverket eller Oslo kommunes instrukser gjelder i hovedsak for anskaffelser med anslått verdi fra 100 000 NOK (ekskl. mva)."

  # NY SEKSJON: Tekster for avslutning og kontaktinfo
