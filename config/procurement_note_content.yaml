# Statiske tekster
static_texts:
  intro: >
    Dette notatet er en automatisert vurdering og veiledning basert på 
    informasjonen du har oppgitt:
  
  disclaimer: >
    Denne veiledningen er generert automatisk og er ment som en støtte. 
    Den erstatter ikke behovet for faglige og forretningsmessige vurderinger.
  
  contact_text: >
    Er du usikker på noe? Kontakt alltid Juridisk avdeling (JA) for bistand. 
    De kan hjelpe med alt fra konkurranse-vurderinger til valg av riktig kontraktsmal.

# Advarsler og meldinger (med emoji)
warnings:
  critical_supplier:
    icon: "⚠️"
    title: "KRITISK ADVARSEL: Potensielt alvorlig avvik funnet"
    text: >
      Vår kontroll indikerer at leverandøren eller dens morselskap kan være 
      listet på Oslomodellens OBS-liste eller internasjonale sanksjonslister.
    action: "Anskaffelsen må ikke fortsette før funnene under er gjennomgått og avklart med Juridisk avdeling."
  
  threshold_500k:
    icon: "🔴"
    title: "KRITISK"
    text: >
      Anskaffelsen er over 500.000 kr. Direkte tildeling er normalt ikke tillatt 
      og krever at vilkårene for unntak fra kunngjøring er oppfylt (f.eks. enerett).
    action: "Kontakt Juridisk avdeling umiddelbart før du går videre."
  
  threshold_100k:
    icon: "🟡"
    title: "ADVARSEL"
    text: >
      Anskaffelsens verdi er over 100.000 kr. Hovedregelen er at konkurranse 
      skal gjennomføres for å sikre effektiv ressursbruk.
    details: >
      En direkte tildeling krever en særskilt begrunnelse. Du må dokumentere 
      hvorfor konkurranse ikke er gjennomført i anskaffelsesprotokollen.
  
  threshold_under_100k:
    icon: "🟢"
    title: "OK"
    text: "Anskaffelsens verdi er under 100.000 kr. Direkte tildeling er normalt akseptabelt."
    details: "Protokoll er ikke påkrevd."

# Prosessveiledning - tekster
process_guidance:
  intro: >
    For å sikre en korrekt og effektiv prosess, anbefales følgende trinn i henhold til 
    Oslobyggs "Prosedyre for enkeltanskaffelser (836-13)":
  
  phases:
    direct_assessment:
      title: "Fase 1: Vurdering av Direkteanskaffelse"
      steps:
        competition:
          text: "Vurder Konkurranseplikt"
          details_high: "Anskaffelsen krever formell konkurranse eller særskilt begrunnelse for unntak."
          details_medium: "Konkurranse bør vurderes for å sikre effektiv ressursbruk."
          details_low: "Direkte tildeling er akseptabelt ved denne verdien."
        
        habilitet:
          text: "Gjennomfør Habilitetsvurdering"
          details: "Selv ved direkte tildeling må habiliteten til de involverte vurderes."
    
    preparation:
      title: "Fase 1: Forberedelser"
      steps:
        framework:
          text: "Kontroller Rammeavtaler"
          details: "Før du starter en ny prosess, sjekk om behovet er dekket av eksisterende avtaler."
        
        habilitet:
          text: "Gjennomfør Habilitetsvurdering"
          details: "Alle involverte i anskaffelsen må vurdere sin habilitet."
    
    competition:
      title: "Fase 2: Konkurranse og Dokumentasjon"
      steps:
        assess_need:
          text: "Vurder Behov for Konkurranse"
          requirement_500k: "For anskaffelser over 500.000 kr er konkurranse påkrevd. Minimum 3 leverandører."
          recommendation: "Hovedregelen er at konkurranse skal arrangeres så langt det er mulig."
        
        tender_docs:
          text: "Utarbeid Konkurransegrunnlag"
          details: "Bruk malen for tilbudsinnbydelse for å sikre alle elementer er med."
        
        protocol:
          text: "Opprett og Før Anskaffelsesprotokoll"
          details: "Det skal føres protokoll for alle anskaffelser over 100.000 kr."
    
    contract:
      title: "Fase 3: Kontrakt"
      steps:
        formal_contract:
          text: "Utarbeid Formell Kontrakt"
          requirements:
            - "Innhent skatteattest (ikke eldre enn 6 mnd)"
            - "Sørg for signatur fra person med fullmakt"
            - "Inkluder alle identifiserte krav"
        
        order_letter:
          text: "Utarbeid Bestillingsbrev"
          details: "Et signert bestillingsbrev er tilstrekkelig for anskaffelser under 500.000 kr."

